[project]
name = "ai-agent"
version = "0.1.0"
description = "RAG + coding-agent service: AST chunker, HF embeddings, ChromaDB store, Ollama LLM."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pydantic>=2.13",
    "chromadb>=1.5.9",
    "langchain-core>=1.6.0",
    "langchain-huggingface>=1.2.2",
    "langchain-ollama>=1.1.0",
    "ollama>=0.6.2",
    "sentence-transformers>=6.0.0",
    "torch>=2.13.0",
    "watchdog>=6.0.0",
]

# Pull torch (and its transitive CUDA stack) from the CPU-only wheel index on
# Linux. This drops the ~5 GB of nvidia-*/triton/cuda-* packages the default
# PyPI wheel would install; the MiniLM embedder runs fine on CPU.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
